services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: papaya-leaf-api
    ports:
      - "8000:8000"
    environment:
      PROJECT_ROOT: /app
      YOLO_MODEL_PATH: /app/models/yolov11_m/best.pt
      CNN_MODEL_PATH: /app/models/efficientnet_b2/best_model.keras
      MODEL_AUTO_DOWNLOAD: "true"
      LOAD_MODELS_ON_STARTUP: "false"
      PORT: "8000"
    volumes:
      - model-cache:/app/models
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: papaya-leaf-web
    ports:
      - "7860:7860"
    environment:
      FASTAPI_URL: http://api:8000
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: "7860"
      REQUEST_TIMEOUT_SECONDS: "300"

volumes:
  model-cache:
    name: papaya-leaf-model-cache
